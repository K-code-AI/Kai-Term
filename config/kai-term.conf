# Kai-Term — settings (kai-term.conf)
#
# The shipped template: every setting, each with the value Kai-Term uses when there is no config file at
# all. Copy it to one of the locations below and change what you want — a line left at its default does
# exactly nothing, so the file can be as long or as short as you like.
#
# Syntax
#   key = value                 one setting per line; spaces around '=' are ignored
#   # note                      a comment line, or a note after a value
#   name#inside                 a '#' with no space before it is part of the value, so
#                               working_dir = /home/me/my#project survives intact, and so does the
#                               colour form background = #101014
#
# Where this file is read from — the first location that holds it wins, the others are never opened:
#   $XDG_CONFIG_HOME/kai-term/kai-term.conf
#   ~/.config/kai-term/kai-term.conf
#   /etc/kai-term/kai-term.conf
# If none of them does, the built-in defaults apply, and those are exactly the values written here.
# -c FILE reads one specific file and skips that search.
#
# KEY BINDINGS ARE NOT IN THIS FILE. They live in kai-term.bind beside it, searched in the same order and
# read AFTER this file (so for a name both files set, kai-term.bind wins). A binding left here still works
# — the log line says where it belongs now — but the place to edit it is kai-term.bind.


# ---------- font and grid ----------

# Fontconfig pattern, not a file name: "monospace", "JetBrains Mono", "DejaVu Sans Mono:style=Bold".
font = monospace

# Glyph height in pixels. Ctrl+Plus / Ctrl+Minus / Ctrl+0 zoom from startup at runtime without
# touching this. Valid range 6-256.
font_size = 14

# The grid the window is sized to at startup. Once running, the window follows the compositor: a
# resized window gets a resized grid. Valid range 20-4096 columns, 4-4096 rows.
cols = 80
rows = 24

# History lines kept. The grid allocates rows + scrollback lines ONCE at startup, so a window taller
# than `rows` keeps fewer of them (rows + scrollback - current_rows). Valid range 0-1000000.
scrollback = 2000

# Pixels of margin between the window edge and the first/last row and column, on all four sides. Keeps
# the corner glyphs out of a compositor's rounded corners; 0 puts the text flush against the edge.
# Pixels left over by whole cells still go to the bottom and right. That margin and those leftover pixels
# are painted with `background` below, so they are the same colour as the cells. Valid range 0-128.
padding = 8

# Window opacity, 0 (fully transparent) to 1 (opaque). The compositor has to support it.
opacity = 1.0


# ---------- colours (ARGB hex; the alpha may be left out) ----------

# The ink and the paper — the whole window's, not just the grid's. One `background` line covers every
# pixel no application has painted: each cell, the `padding` margin and the leftover pixels at the bottom
# and right, so it cannot leave a frame of a second colour around the text. The file manager's panes use
# these two as well, so it matches the terminal instead of bringing its own palette. Neither one
# overrides an application: `SGR 40` / `48;5;0` paint palette entry 0 (black), not `background`.
foreground = #e5e5e5
background = #101014

# The cursor block.
cursor_color = #d8d8d8


# ---------- shell ----------

# What to run. Empty means $SHELL. -e COMMAND overrides this for one launch.
shell =

# Start a recognised shell (fish, bash, zsh) with Kai-Term's integration script, so the file manager can
# ask the SHELL to change its own directory instead of typing `cd` at your prompt — and so a bare
# `bash`/`fish`/`zsh` you start at the prompt is integrated too. 0 starts every shell exactly as it was
# before this feature existed, and the file manager then only ever types.
shell_integration = 1

# Where the shell starts. Empty means the home directory. -w DIR overrides this for one launch.
working_dir =

# The xdg-shell app_id the compositor identifies the window by: niri/Sway window rules, the taskbar
# entry and "open terminal here" all key off it. An empty value means the built-in default.
app_id = Kai-Term


# ---------- terminal behaviour ----------

# `clear` (CSI 3 J) also drops the scrollback buffer. 0 keeps the history and only clears the screen.
clear_scrollback = 1

# Releasing a selection drag copies to the clipboard. 0 (the default) means selecting only SELECTS and
# you copy with Ctrl+Shift+C.
copy_on_release = 0

# Inside a full-screen program that never asked for the mouse (nano, less, man, htop) the only thing
# that can move it is keystrokes. wheel_sends_keys: 1 = the wheel sends Up/Down presses there, which is
# what scrolls them; 0 = the wheel does nothing in that state. click_moves_cursor: 1 = a left click that
# does not drag walks the program's own cursor to the clicked cell; 0 = a click only ever selects text.
# A program that DID ask for the mouse (vim, htop, tmux) keeps getting mouse reports either way, and a
# drag — or Shift + click — always selects.
wheel_sends_keys = 1
click_moves_cursor = 1

# Kai-Term drives its own key repeat, because a Wayland compositor never sends repeat events.
# repeat_delay = milliseconds a key must be held before the first repeat (0 = leave repeat to the
# compositor). repeat_rate = repeats per second after that. Valid range 0-5000 ms, 1-200/s.
repeat_delay = 300
repeat_rate = 30


# ---------- sessions (tabs) and layout ----------

# Sessions one window may hold. Valid range 1-64.
max_tabs = 8

# How the sessions are SHOWN. off = never draw the tab bar (the window title and the keyboard are the
# only way to see the others), auto = draw it from the second session on, so a single-session window
# shows no bar at all, always = also with one session.
tab_bar = auto

# Sessions drawn side by side at most. More sessions stay open and stay listed in the bar; the shown
# group of panes slides to contain the visible one. Valid range 1-64.
split_max = 4


# ---------- file manager ----------

# Show the file-manager band from startup instead of only when its shortcut is pressed. Off by default:
# a user who never presses the shortcut sees exactly the plain terminal, and closing the band returns to
# that state.
file_manager = 0

# The PERCENT of the window's text area the band asks for. It is a share and not a row count, so the
# band keeps its proportion through a resize or a zoom. Clamped to 10-95 and shrunk further so the
# terminal keeps at least 3 rows; if even that does not fit, the band is dropped for that frame.
fm_size = 75

# The preview pane next to the browser (the `v` key toggles it at runtime). Off = the browser is full
# width.
fm_preview = 1

# Dotfiles are part of the listing from the start (the `.` key toggles it at runtime).
fm_show_hidden = 0

# Browsing into a directory also moves the SHELL there — through the shell integration when the shell
# has it, by typing `cd '<path>'` at the prompt when it does not. Off = the shell stays where you left
# it. Nothing is ever run: the `cd` is typed and left for you to press Enter.
fm_follow = 1


# ---------- logging ----------

# 0 = errors, 1 = warnings (the default), 2 = info, 3 = debug. -d raises it to 3 for one launch and
# beats this line.
log = 1
